spring.application.name=wpBot

# Multipart dosya yükleme ayarları
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Sunucu Base URL (Lokal geliştirme için localhost, canlı ortam için sunucu IP)
# Lokal:  http://localhost:8080
# Canlı:  http://94.130.231.165:8080
app.server.url=http://localhost:8080

# H2 Veritabanı (file tabanlı - restart'ta veriler korunur)
spring.datasource.url=jdbc:h2:file:./data/wpbot
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (geliştirme için)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

